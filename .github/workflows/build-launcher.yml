name: Build Launcher

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: src/DeadCellsModLauncher/DeadCellsMultiplayerModInstaller.csproj
  PUBLISH_DIR: dist/publish
  RELEASE_EXE: dist/release/DeadCellsModLauncher.exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore $env:PROJECT

      - name: Publish one-file self-contained Windows build
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false `
            -p:ContinuousIntegrationBuild=true `
            -o $env:PUBLISH_DIR

          $launcher = Join-Path $env:PUBLISH_DIR 'DeadCellsModLauncher.exe'
          if (-not (Test-Path $launcher)) {
            Write-Error "Expected launcher was not found: $launcher"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path (Split-Path $env:RELEASE_EXE) | Out-Null
          Copy-Item $launcher $env:RELEASE_EXE -Force

      - name: Check optional signing configuration
        id: signing_config
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64) -and
              -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            'enabled=true' >> $env:GITHUB_OUTPUT
          } else {
            'enabled=false' >> $env:GITHUB_OUTPUT
          }

      - name: Sign launcher when certificate secrets are configured
        if: steps.signing_config.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'launcher-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))

          $kitsRoot = ${env:ProgramFiles(x86)}
          $signtool = Get-ChildItem "$kitsRoot\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            Write-Error 'signtool.exe was not found on the GitHub runner.'
            exit 1
          }

          $launcher = $env:RELEASE_EXE
          & $signtool.FullName sign `
            /f $certPath `
            /p $env:SIGNING_CERT_PASSWORD `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            $launcher

          if ($LASTEXITCODE -ne 0) {
            throw 'Authenticode signing failed.'
          }

          & $signtool.FullName verify /pa /v $launcher
          if ($LASTEXITCODE -ne 0) {
            throw 'Authenticode signature verification failed.'
          }

          Remove-Item $certPath -Force -ErrorAction SilentlyContinue

      - name: Show signing status
        shell: pwsh
        run: |
          $launcher = $env:RELEASE_EXE
          $signature = Get-AuthenticodeSignature $launcher
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.SignerCertificate) {
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          } else {
            Write-Host 'Launcher is unsigned. Add WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD repository secrets to enable signing.'
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash $env:RELEASE_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = 'dist/release/SHA256SUMS.txt'
          "$exeHash  DeadCellsModLauncher.exe" | Set-Content -Path $checksumPath -Encoding ascii

          Write-Host 'Release checksum:'
          Get-Content $checksumPath

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadCellsModLauncher
          path: |
            dist/release/DeadCellsModLauncher.exe
            dist/release/SHA256SUMS.txt

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Dead Cells Mod Launcher ${{ github.ref_name }}
          files: |
            dist/release/DeadCellsModLauncher.exe
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
